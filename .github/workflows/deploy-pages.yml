name: Deploy tutorial to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test maintenance deletion guards and benchmark entry point
        run: |
          python3 -m unittest discover -s .agents/skills/okhp3-replit-repl-janitor/tests -v
          python3 .agents/skills/okhp3-replit-free-mode-autonomy/benchmarks/run-native-telemetry.py --help
      - name: Run pure contract checks
        run: npm run test:contracts
      - name: Test technology review failure and update handling
        run: npm run test:technology-audit

  build:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and typecheck
        run: npm run build
      - name: Check archive integrity
        run: npm run check:archive
      - name: Check campaign evidence boundaries
        run: npm run check:campaign-evidence
      - name: Check Mermaid delivery
        run: npm run health:mermaid
      - name: Browser acceptance with runner Chrome
        shell: bash
        run: |
          set -euo pipefail
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          "$CHROMIUM_PATH" --version
          npm run test:acceptance
      - name: Add Pages fallback
        if: github.event_name != 'pull_request'
        run: cp dist/index.html dist/404.html
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
