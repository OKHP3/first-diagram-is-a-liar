name: Technology version review

on:
  schedule:
    - cron: '17 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: technology-version-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out inventory
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Compare installed contracts with official stable releases
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run audit:technologies
      - name: Refresh one review issue when findings change
        if: ${{ always() && hashFiles('.local/technology-review/technology-versions.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/technology-review-issue.mjs .local/technology-review/technology-versions.json
      - name: Preserve complete version report
        if: ${{ always() && hashFiles('.local/technology-review/technology-versions.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: technology-versions
          path: .local/technology-review/
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
