kind = "web"
previewPath = "/"
title = "The First Diagram Is Usually a Liar"
description = "The public editorial archive and interactive guide for The First Diagram Is Usually a Liar, preserving its diagrams, evidence, and release history."
version = "1.0.0"
id = "artifacts/first-diagram-is-a-liar"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19394

[services.development]
run = "pnpm --filter @workspace/first-diagram-is-a-liar run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/first-diagram-is-a-liar", "run", "build" ]
serve = "static"
publicDir = "artifacts/first-diagram-is-a-liar/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19394"
BASE_PATH = "/"
